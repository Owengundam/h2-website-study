name: Publish H2 redesigned website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package original branding and public copy, then validate links
        run: python scripts/package_redesign.py
      - name: Check annotation removals, SVG icons and original brand bytes
        run: python scripts/test_annotation_polish.py _site
      - name: Install browser test tools
        run: |
          pip install --timeout 30 playwright
          python -m playwright install chromium
      - name: Check responsive layout, stable hover, icons and round back-to-top
        run: python scripts/test_annotation_polish.py _site --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annotation-qa
          path: annotation-qa
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish updated H2 website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live pages, annotation fixes and unchanged original logo
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: python
        run: |
          import hashlib, json, os, time, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/')
          expected = os.environ['GITHUB_SHA']
          paths = [('', 'Architecture for hospitality'), ('work/index.html', 'Selected work'), ('projects/nalati-indigo/', 'Low-rise buildings, shared horizons.'), ('cn/', '那拉提')]
          for attempt in range(12):
              try:
                  stamp = str(time.time_ns())
                  def get(path, binary=False):
                      url = base + '/' + path + '?deployment=' + stamp
                      req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'H2-deployment-check'})
                      with urllib.request.urlopen(req, timeout=25) as response:
                          data = response.read()
                          return data if binary else data.decode('utf-8')
                  deployment = json.loads(get('deployment.json'))
                  assert deployment['commit'] == expected, 'An older deployment is still cached'
                  for path, marker in paths:
                      page = get(path)
                      assert marker in page, 'Unexpected content at ' + path
                      assert 'brand-logo' in page, 'Original logo missing'
                      assert 'ui-polish.css' in page and 'class="ui-arrow"' in page, 'SVG interface update missing'
                      assert 'footer-statement' not in page, 'Removed footer slogan returned'
                      assert 'studio-film-caption' not in page, 'Removed film caption returned'
                  css = get('ui-polish.css')
                  assert 'border-radius: 50%' in css and 'transition: none' in css
                  integrity = json.loads(get('brand-integrity.json'))
                  for variant in ('black', 'white'):
                      logo = get('assets/brand/h2-logo-' + variant + '.png', binary=True)
                      assert hashlib.sha256(logo).hexdigest() == integrity['logo_sha256'][variant]
                  assert integrity['film_source'] in get(''), 'Original atmosphere film missing'
                  print('Verified live annotation fixes, original logo bytes and expanded copy:', expected, base + '/')
                  break
              except Exception as error:
                  if attempt == 11:
                      raise RuntimeError('Live verification failed: ' + str(error)) from error
                  time.sleep(8)
      - name: Check original film origin availability
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: python
        run: |
          import os, urllib.request
          url='https://www.h2arch.com/wp-content/uploads/2023/10/20230928-atmosphere%E4%BD%8E%E6%B8%85%E7%89%88.mp4'
          request=urllib.request.Request(url,headers={'Range':'bytes=0-511','User-Agent':'Mozilla/5.0','Referer':os.environ['PAGE_URL']})
          with urllib.request.urlopen(request,timeout=30) as response:
              header=response.read(64)
              assert b'ftyp' in header, 'The original film origin did not return an MP4 header'
              print('Original H2 film origin reachable:',response.status,response.headers.get('Content-Type'),response.headers.get('Content-Range'))
