name: Import captured website
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-h2-archive
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Download and verify study archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/h2-import"
          gh release download capture-2026-10-08 --repo "$GITHUB_REPOSITORY" --pattern h2-website-study.zip --dir "$RUNNER_TEMP/h2-import"
          cd "$RUNNER_TEMP/h2-import"
          echo "8f16350646ec552b9ff371e299913d26a263a31eea3d732400c68f9f2a8f45ab  h2-website-study.zip" | sha256sum --check -
          unzip -q h2-website-study.zip
      - name: Commit captured files
        run: |
          cp -a "$RUNNER_TEMP/h2-import/h2-website-study/." .
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import H2 website study archive and capture report"
          git push origin HEAD:main
