name: Test Our Work video controls
on:
  push:
    branches: [fix/our-work-video-fit, fix/minimal-film-controls]
    paths:
      - redesign/studio-home.css
      - redesign/editorial.css
      - redesign/editorial.js
      - scripts/test_video_fit.py
      - scripts/test_film_controls.py
      - .github/workflows/video-fit-test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package the site and validate local links
        run: |
          python scripts/package_redesign.py
          node --check redesign/editorial.js
      - name: Install browser test tools
        run: |
          pip install --timeout 30 playwright
          python -m playwright install chromium
      - name: Check white hover icons, touch, keyboard, fullscreen and unchanged picture geometry
        run: python scripts/test_film_controls.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: our-work-video-controls
          path: video-fit-qa
          retention-days: 7
